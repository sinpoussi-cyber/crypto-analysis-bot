# --- UNIVERS de cryptos analysees ---
# mode: list  -> utilise la liste `cryptos` ci-dessous.
# mode: top_n -> recupere dynamiquement les N premieres par capitalisation
#                (CoinGecko), mappees aux paires USDT negociables sur Binance.
universe:
  mode: top_n              # "list" ou "top_n"
  top_n: 100               # top 100 par capitalisation (recupere dynamiquement)
  volatile_n: 30           # + les 30 plus volatiles (au-dela du top 100)
  volatile_pool: 300       # pool ou chercher les volatiles (par capitalisation)
  exclude_stablecoins: true   # stablecoins exclus : inutiles pour un signal directionnel

# Binance est geo-bloque (HTTP 451) sur GitHub Actions -> on passe direct par CoinGecko.
# Mettre true seulement en local, dans une region ou Binance n'est pas bloque.
use_binance: false

# Liste explicite (utilisee si universe.mode == list, et pour tes 6 cryptos de depart).
cryptos:
  BTC:  { binance: BTCUSDT,  coingecko_id: bitcoin }
  ETH:  { binance: ETHUSDT,  coingecko_id: ethereum }
  SOL:  { binance: SOLUSDT,  coingecko_id: solana }
  TRX:  { binance: TRXUSDT,  coingecko_id: tron }
  LINK: { binance: LINKUSDT, coingecko_id: chainlink }
  GRAM: { binance: null,     coingecko_id: the-open-network }

history_days: 360          # plan Demo CoinGecko : 365 j max (borne aussi cote code)
vol_window: 180            # fenetre volatilite pour la projection

# --- Optimisation walk-forward (reentrainement hebdomadaire) ---
train_window: 210          # fenetre d'entrainement (jours) — compatible plafond 365 j
valid_window: 60           # fenetre de validation hors-echantillon (jours)
cost: 0.001                # frais par changement de position (0,1%)
predict_horizon: 5         # horizon (jours) de la cible du modele de prediction

# --- Seuils de la strategie ---
signal:
  buy_threshold: 0.35      # entree (score composite)
  sell_threshold: -0.10    # sortie (hysteresis)

# --- Niveaux de trade mecaniques (prix d'achat, objectif, stop, duree) ---
# Derives de la volatilite, PAS d'une prediction. tp_sigma/sl_sigma = multiples
# d'ecart-type ; ratio objectif/stop = tp_sigma / sl_sigma.
levels:
  tp_sigma: 1.5            # objectif de vente a la hausse : +1.5 sigma
  sl_sigma: 1.0            # seuil de vente a la baisse (stop) : -1.0 sigma
  hold_k: 21              # duree = hold_k / volatilite_annualisee
  hold_min: 7            # duree minimale (jours)
  hold_max: 45           # duree maximale (jours)

# --- Canaux d'envoi ---
notify:
  telegram: false         # Telegram desactive
  email: true             # envoi par e-mail uniquement
  commit_report: true
