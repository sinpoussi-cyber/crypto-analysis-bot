name: Note crypto quotidienne

# Se declenche tous les jours a 06:00 UTC (06:00 a Abidjan, UTC+0)
# et manuellement via l'onglet Actions ("Run workflow").
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write        # pour committer le rapport du jour dans reports/

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer l'analyse et l'envoi
        env:
          # Donnees de marche
          COINGECKO_API_KEY:  ${{ secrets.COINGECKO_API_KEY }}
          # Cascade IA : DeepSeek -> Kimi -> Claude
          AI_PROVIDER_ORDER:  ${{ secrets.AI_PROVIDER_ORDER }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL:     ${{ secrets.DEEPSEEK_MODEL }}
          KIMI_API_KEY:       ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL:         ${{ secrets.KIMI_MODEL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:    ${{ secrets.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: python -m src.main

      - name: Archiver le rapport du jour
        run: |
          git config user.name  "crypto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/ || true
          git commit -m "Note du $(date -u +%Y-%m-%d)" || echo "Rien a committer"
          git push || echo "Push ignore"
